<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Decision Pipeline Explorer</title>
<style>
  :root { --bg: #0d1117; --fg: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --dim: #8b949e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; padding: 24px; }
  h1 { font-size: 20px; color: var(--accent); margin-bottom: 4px; }
  .subtitle { color: var(--dim); font-size: 12px; margin-bottom: 24px; }
  .pipeline { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .stage { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; text-align: center; min-width: 110px; }
  .stage.active { border-color: var(--accent); box-shadow: 0 0 8px rgba(88,166,255,0.25); }
  .stage-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stage-value { font-size: 16px; margin-top: 4px; }
  .arrow { color: var(--dim); font-size: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bar-label { width: 100px; font-size: 13px; }
  .bar-track { flex: 1; height: 18px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }
  .bar-fill.selected { background: var(--green); }
  .bar-value { width: 50px; text-align: right; font-size: 13px; }
  .gate { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-size: 13px; }
  .gate.auto { background: rgba(63,185,80,0.15); border: 1px solid var(--green); color: var(--green); }
  .gate.human { background: rgba(210,153,34,0.15); border: 1px solid var(--yellow); color: var(--yellow); }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .meta span { margin-right: 16px; }
  input[type=file] { margin-bottom: 16px; }
  pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-size: 12px; overflow-x: auto; max-height: 300px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Laya Decision Pipeline Explorer</h1>
<div class="subtitle">Text in, typed probabilities out. Single forward pass, 0 output tokens.</div>

<label for="file">Load a capture JSONL:</label><br>
<input type="file" id="file" accept=".jsonl,.json"><br>

<div id="viewer" class="hidden">
  <div class="meta" id="meta"></div>

  <div class="pipeline" id="pipeline"></div>

  <div class="grid">
    <div class="card">
      <h2>Probabilities</h2>
      <div id="bars"></div>
      <div id="gate" class="gate"></div>
    </div>
    <div class="card">
      <h2>Internals</h2>
      <div id="internals"></div>
    </div>
  </div>

  <h2 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin-bottom:8px;">Raw Record</h2>
  <pre id="raw"></pre>
</div>

<div id="empty" style="color:var(--dim);">Load a capture file or viz-web/runs/demo.jsonl to begin.</div>

<script>
const STAGES = ['Tokenize', 'Encode', 'Score [MASK]', 'Calibrate', 'Decide'];

function render(record) {
  document.getElementById('empty').classList.add('hidden');
  document.getElementById('viewer').classList.remove('hidden');

  const out = record.output || {};
  const probs = out.probabilities || {};
  const stages = record.stages || {};
  const internals = record.internals || {};
  const inp = record.input || {};

  // Meta
  document.getElementById('meta').innerHTML =
    `<span>tokens: ${inp.tokens || '?'}</span>` +
    `<span>total_ms: ${stages.total_ms || '?'}</span>` +
    `<span>load_ms: ${stages.load_ms || '?'}</span>`;

  // Pipeline
  let pipeHtml = '';
  STAGES.forEach((s, i) => {
    const active = i === STAGES.length - 1 ? 'active' : '';
    pipeHtml += `<div class="stage ${active}"><div class="stage-label">${s}</div></div>`;
    if (i < STAGES.length - 1) pipeHtml += `<div class="arrow">→</div>`;
  });
  document.getElementById('pipeline').innerHTML = pipeHtml;

  // Bars
  const sorted = Object.entries(probs).sort((a, b) => b[1] - a[1]);
  let barsHtml = '';
  sorted.forEach(([label, p]) => {
    const pct = (p * 100).toFixed(1);
    const isSelected = label === out.choice;
    barsHtml += `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill ${isSelected ? 'selected' : ''}" style="width:${pct}%"></div></div>
      <div class="bar-value">${p}</div>
    </div>`;
  });
  document.getElementById('bars').innerHTML = barsHtml;

  // Confidence gate
  const conf = out.confidence || 0;
  const gate = document.getElementById('gate');
  if (conf >= 0.85) {
    gate.className = 'gate auto';
    gate.textContent = `confidence gate: ${conf.toFixed(4)} >= 0.85 → AUTO`;
  } else {
    gate.className = 'gate human';
    gate.textContent = `confidence gate: ${conf.toFixed(4)} < 0.85 → HUMAN REVIEW`;
  }

  // Internals
  document.getElementById('internals').innerHTML =
    `<div class="meta">temperature: ${JSON.stringify(internals.temperature || {})}</div>` +
    `<div class="meta">marker_logits_raw: ${JSON.stringify(internals.marker_logits_raw || [])}</div>`;

  // Raw
  document.getElementById('raw').textContent = JSON.stringify(record, null, 2);
}

// File input
document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  const firstLine = text.split('\n')[0];
  try { render(JSON.parse(firstLine)); } catch (err) { alert('Invalid JSON: ' + err.message); }
});

// Load demo on page load
async function loadDemo() {
  try {
    const r = await fetch('runs/demo.jsonl');
    if (!r.ok) return;
    const text = await r.text();
    const firstLine = text.split('\n')[0];
    if (firstLine) render(JSON.parse(firstLine));
  } catch (e) { /* demo not available */ }
}
loadDemo();
</script>
</body>
</html>
