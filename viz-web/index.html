<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya — ask, get a decision</title>
<style>
  :root { --bg: #0d1117; --fg: #c9d1d9; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149; --dim: #8b949e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 16px; padding: 32px 20px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .live { color: var(--green); font-size: 12px; margin-bottom: 16px; }
  .live.down { color: var(--yellow); }
  textarea { width: 100%; min-height: 110px; background: #161b22; color: var(--fg); border: 1px solid #30363d; border-radius: 10px; padding: 14px; font-family: inherit; font-size: 16px; resize: vertical; }
  .tasks { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .tasks button { background: transparent; color: var(--accent); border: 1px solid #30363d; border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .tasks button.on { border-color: var(--accent); background: rgba(88,166,255,0.12); }
  #run { width: 100%; background: var(--accent); color: #0d1117; border: none; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  #run:disabled { opacity: 0.5; cursor: wait; }
  #err { color: var(--red); font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
  #out { margin-top: 24px; display: none; }
  #out.show { display: block; }
  .decision { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .decision small { font-size: 14px; color: var(--dim); font-weight: 400; }
  .proof { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 110px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 22px; background: #21262d; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .bar-fill.win { background: var(--green); }
  .bar-value { width: 52px; text-align: right; font-size: 14px; }
  .gate { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; }
  .gate.auto { background: rgba(63,185,80,0.12); border: 1px solid var(--green); color: var(--green); }
  .gate.human { background: rgba(210,153,34,0.12); border: 1px solid var(--yellow); color: var(--yellow); }
  .action { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: #161b22; border: 1px solid #30363d; font-size: 14px; }
  .action .warn { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<h1>Laya</h1>
<div class="sub">Write text. Get a decision with probabilities.</div>
<div id="live" class="live">connecting…</div>

<textarea id="q" placeholder="Paste an email, message, or describe a situation…">Your account will be locked in 24h. Click here to verify your password immediately.</textarea>
<div class="tasks" id="tasks">
  <button data-t="phishing" class="on">Is it phishing?</button>
  <button data-t="spam">Is it spam?</button>
  <button data-t="urgent">Is it urgent?</button>
  <button data-t="refund">Wants a refund?</button>
  <button data-t="custom">Custom…</button>
</div>
<div id="custombox" style="display:none">
  <label for="cq" style="display:block;font-size:12px;color:var(--dim);margin:10px 0 4px">What are you deciding?</label>
  <input type="text" id="cq" value="Which folder should this go to?" style="width:100%;background:#161b22;color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:10px;font-family:inherit;font-size:14px">
  <label for="copts" style="display:block;font-size:12px;color:var(--dim);margin:10px 0 4px">Your answers — one per line, <code>label: what it means</code></label>
  <textarea id="copts" style="min-height:80px">money-stuff: anything about payments or invoices
people-stuff: messages from family or friends
junk: ads or scams</textarea>
</div>
<button id="run">Decide</button>
<div id="err"></div>

<div id="out">
  <div class="decision" id="decision"></div>
  <div class="proof" id="proof"></div>
  <div id="bars"></div>
  <div id="gate" class="gate"></div>
  <div class="action" id="action"></div>
</div>

<script>
const $ = id => document.getElementById(id);
// Each task = fixed question the model answers about YOUR text.
const TASKS = {
  phishing: { type: 'choice', instructions: 'What is this message?',
    criteria: { phishing: 'fraudulent attempt to steal credentials or money',
      legitimate: 'genuine message from a real sender',
      'needs-review': 'cannot decide, needs a human' } },
  spam: { type: 'noul', instructions: 'Is this message unsolicited spam or bulk marketing?' },
  urgent: { type: 'noul', instructions: 'Does this message communicate time pressure or a deadline?' },
  refund: { type: 'noul', instructions: 'Does the writer ask for money back?' },
};
let task = 'phishing';
document.querySelectorAll('#tasks button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#tasks button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); task = b.dataset.t;
  $('custombox').style.display = task === 'custom' ? 'block' : 'none';
}));

// Custom task: YOUR labels become the answer space — the model scores
// whatever options you send, no retraining, no preset needed.
function currentQuestion() {
  if (task !== 'custom') return TASKS[task];
  const instructions = $('cq').value.trim();
  if (!instructions) throw new Error('Say what you are deciding.');
  const crit = {};
  for (const line of $('copts').value.split('\n').map(s => s.trim()).filter(Boolean)) {
    const i = line.indexOf(':');
    if (i < 0) crit[line] = line;
    else crit[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  if (!Object.keys(crit).length) throw new Error('Add at least one answer option.');
  return { type: 'choice', instructions, criteria: crit };
}

let live = false;
async function health() {
  try {
    const r = await fetch('/api/health'); const h = await r.json();
    live = !!(h && h.ok);
    $('live').className = 'live' + (live ? '' : ' down');
    $('live').textContent = live ? `● live model: ${h.model}` : '○ backend offline — start `python3 viz/serve.py`';
    $('run').disabled = !live;
  } catch (e) {
    $('live').className = 'live down';
    $('live').textContent = '○ backend offline — start `python3 viz/serve.py`';
    $('run').disabled = true;
  }
}

$('run').addEventListener('click', async () => {
  $('err').textContent = '';
  const text = $('q').value.trim();
  if (!text) { $('err').textContent = 'Write something first.'; return; }
  $('run').disabled = true; $('run').textContent = 'Thinking…';
  try {
    const r = await fetch('/api/predict', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: { text }, questions: { q1: currentQuestion() } }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    show(d.answers.q1, d.usage, d.stages, d.request_id);
  } catch (e) { $('err').textContent = e.message; }
  $('run').disabled = false; $('run').textContent = 'Decide';
});

function show(a, usage, stages, reqId) {
  $('out').classList.add('show');
  usage = usage || {}; stages = stages || {};
  let title, probs;
  if (a.type === 'noul') {
    const yes = a.noul;
    title = (yes >= 0.5 ? 'YES' : 'NO') + ` <small>${(yes * 100).toFixed(0)}% sure</small>`;
    probs = [['yes', yes], ['no', 1 - yes]];
  } else {
    title = `${a.choice} <small>${((a.probabilities[a.choice] || 0) * 100).toFixed(0)}%</small>`;
    probs = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]);
  }
  $('decision').innerHTML = title;
  // Proof this is a fresh inference: server request #, ms that varies, tokens counted from YOUR text.
  $('proof').textContent =
    `run #${reqId ?? '?'} · ${stages.total_ms ?? '?'} ms · ${usage.input_tokens ?? '?'} input tokens · 0 output tokens`;
  const top = probs.length ? probs[0][0] : null;
  $('bars').innerHTML = probs.map(([l, p]) =>
    `<div class="bar-row"><div class="bar-label">${l}</div>` +
    `<div class="bar-track"><div class="bar-fill${l === top ? ' win' : ''}" style="width:${(p * 100).toFixed(1)}%"></div></div>` +
    `<div class="bar-value">${Number(p).toFixed(2)}</div></div>`).join('');
  const conf = a.confidence;
  const g = $('gate');
  if (a.type === 'noul' && conf === undefined) {
    g.className = 'gate human'; g.textContent = 'Yes/no models report no confidence — the probability is the belief.';
  } else if (conf >= 0.85) { g.className = 'gate auto'; g.textContent = `High confidence (${Number(conf).toFixed(2)}) — safe to act automatically.`; }
  else { g.className = 'gate human'; g.textContent = `Low confidence (${Number(conf).toFixed(2)}) — a human should review.`; }
  const act = a.action && a.action.act_probability;
  $('action').innerHTML = act !== undefined
    ? `Model action signal: <b>${act}</b><br><span class="warn">Always ≈1.0 on this checkpoint — informational only, never used for decisions.</span>`
    : '<span class="warn">No action signal in this answer.</span>';
  $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
health();
</script>
</body>
</html>
