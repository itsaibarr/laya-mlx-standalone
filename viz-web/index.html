<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya — decide anything</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --red: #f85149; --dim: #8b949e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 16px; padding: 28px 18px 60px; max-width: 620px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .dot { font-size: 12px; margin-bottom: 18px; color: var(--green); }
  .dot.off { color: var(--yellow); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  textarea, input { width: 100%; background: #161b22; color: var(--fg); border: 1px solid #30363d; border-radius: 10px; padding: 13px; font-family: inherit; font-size: 16px; }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  #text { min-height: 100px; resize: vertical; }
  #opts { min-height: 86px; resize: vertical; }
  #run { width: 100%; background: var(--accent); color: #06121f; border: none; border-radius: 12px; padding: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 6px; }
  #run:disabled { opacity: 0.5; }
  #err { color: var(--red); font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
  #out { display: none; margin-top: 26px; padding-top: 22px; border-top: 1px solid #21262d; }
  #out.show { display: block; }
  .answer { font-size: 32px; font-weight: 800; }
  .answer small { display: block; font-size: 14px; color: var(--dim); font-weight: 400; margin-top: 2px; }
  .proof { font-size: 11px; color: var(--dim); margin: 8px 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .lab { width: 118px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { flex: 1; height: 24px; background: #21262d; border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .fill.win { background: var(--green); }
  .val { width: 48px; text-align: right; font-size: 14px; }
  .verdict { margin-top: 16px; padding: 13px 15px; border-radius: 9px; font-size: 15px; }
  .verdict.go { background: rgba(63,185,80,0.12); border: 1px solid var(--green); color: var(--green); }
  .verdict.wait { background: rgba(210,153,34,0.12); border: 1px solid var(--yellow); color: var(--yellow); }
  .act { margin-top: 10px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<h1>Laya</h1>
<div class="sub">Describe it. List the possible answers. Get the model's call. · <a href="/snake.html" style="color:var(--accent)">🐍 watch it play snake</a></div>
<div id="live" class="dot">● connecting…</div>

<div class="field">
  <label for="text">Your text</label>
  <textarea id="text" placeholder="Paste an email, a message, a situation…">Your account will be locked in 24h. Click here to verify your password immediately.</textarea>
</div>
<div class="field">
  <label for="ask">What are you deciding?</label>
  <input id="ask" value="What is this message?">
</div>
<div class="field">
  <label for="opts">Possible answers — one per line</label>
  <textarea id="opts">phishing — a scam to steal credentials or money
legitimate — a genuine message
not sure — needs a human</textarea>
</div>
<button id="run">Decide</button>
<div id="err"></div>

<div id="out">
  <div class="answer" id="answer"></div>
  <div class="proof" id="proof"></div>
  <div id="bars"></div>
  <div id="verdict" class="verdict"></div>
  <div class="act" id="act"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let live = false;

async function health() {
  try {
    const h = await (await fetch('/api/health')).json();
    live = !!(h && h.ok);
    $('live').className = 'dot' + (live ? '' : ' off');
    $('live').textContent = live ? `● live: ${h.model}` : '○ offline — run: python3 viz/serve.py';
    $('run').disabled = !live;
  } catch (e) {
    $('live').className = 'dot off';
    $('live').textContent = '○ offline — run: python3 viz/serve.py';
    $('run').disabled = true;
  }
}

// "label — meaning" or "label: meaning" or bare label per line.
function parseOptions() {
  const crit = {};
  for (const line of $('opts').value.split('\n').map(s => s.trim()).filter(Boolean)) {
    let i = line.indexOf('—');
    if (i < 0) i = line.indexOf(':');
    if (i < 0) crit[line] = line;
    else crit[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return crit;
}

$('run').addEventListener('click', async () => {
  $('err').textContent = '';
  const text = $('text').value.trim();
  const ask = $('ask').value.trim();
  const crit = parseOptions();
  if (!text) return $('err').textContent = 'Write your text first.';
  if (!ask) return $('err').textContent = 'Say what you are deciding.';
  if (!Object.keys(crit).length) return $('err').textContent = 'List at least one possible answer.';
  $('run').disabled = true; $('run').textContent = 'Deciding…';
  try {
    const r = await fetch('/api/predict', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: { text },
        questions: { q1: { type: 'choice', instructions: ask, criteria: crit } } }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    show(d.answers.q1, d.usage, d.stages, d.request_id);
  } catch (e) { $('err').textContent = e.message; }
  $('run').disabled = false; $('run').textContent = 'Decide';
});

function show(a, usage, stages, reqId) {
  $('out').classList.add('show');
  usage = usage || {}; stages = stages || {};
  const probs = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]);
  const top = probs.length ? probs[0] : ['?', 0];
  $('answer').innerHTML = `${top[0]}<small>${(top[1] * 100).toFixed(0)}% · confidence ${Number(a.confidence || 0).toFixed(2)}</small>`;
  $('proof').textContent = `fresh run #${reqId ?? '?'} · ${stages.total_ms ?? '?'} ms · ${usage.input_tokens ?? '?'} tokens in, 0 out`;
  $('bars').innerHTML = probs.map(([l, p]) =>
    `<div class="row"><div class="lab">${l}</div>` +
    `<div class="track"><div class="fill${l === top[0] ? ' win' : ''}" style="width:${(p * 100).toFixed(1)}%"></div></div>` +
    `<div class="val">${Number(p).toFixed(2)}</div></div>`).join('');
  const v = $('verdict');
  if ((a.confidence || 0) >= 0.85) { v.className = 'verdict go'; v.textContent = 'Confident — safe to act on.'; }
  else { v.className = 'verdict wait'; v.textContent = 'Not sure — get a human to check.'; }
  const act = a.action && a.action.act_probability;
  $('act').textContent = act !== undefined ? `model action signal: ${act} (always ≈1 — ignore it)` : '';
  $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
health();
</script>
</body>
</html>
